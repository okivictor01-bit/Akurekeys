<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkureKeys — Dashboard</title>
<link rel="stylesheet" href="/akure.css">
<style>.btnrow{display:flex;gap:8px}.btnrow .btn{flex:1;margin-top:0}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
<div class="topbar">
 <div class="logo">🔑</div>
 <div class="brand">AkureKeys<small>Your dashboard</small></div>
</div>
<div id="authBox" class="card">
 <h2>Welcome back</h2>
 <input id="email" type="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button id="signin" class="btn btn-primary">Sign in</button>
</div>
<div id="msg" class="msg hide"></div>
<div id="dash" class="hide">
 <div class="hero"><h1 id="roleLine"></h1><p><a class="link" style="color:#ffe9a8" href="/browse.html">Browse</a> • <a style="color:#ffe9a8" href="/inspect.html">Inspections</a> • <a style="color:#ffe9a8" href="/rent.html">Rent</a> • <a style="color:#ffe9a8" href="/admin.html">Admin</a></p></div>
 <div id="addBox" class="card hide">
  <h2>🏗️ Add a property</h2>
  <p class="muted">Goes to admin for approval before tenants can see it.</p>
  <input id="p_title" placeholder="Title e.g. Clean self-contain at Oba Adesida">
  <select id="p_type">
   <option value="room">room</option><option value="self_contain_room">self_contain_room</option>
   <option value="room_and_parlour">room_and_parlour</option><option value="self_contain_room_and_parlour">self_contain_room_and_parlour</option>
   <option value="two_bedroom_flat">two_bedroom_flat</option><option value="three_bedroom_flat">three_bedroom_flat</option>
   <option value="duplex">duplex</option><option value="shop">shop</option><option value="office">office</option><option value="container">container</option>
  </select>
  <input id="p_rent" type="number" placeholder="Annual rent (₦)">
  <input id="p_addr" placeholder="Street address">
  <input id="p_land" placeholder="Area / landmark">
  <input id="p_desc" placeholder="Short description">
  <div class="btnrow"><input id="p_bed" type="number" placeholder="Beds"><input id="p_bath" type="number" placeholder="Baths"></div>
  <button id="submitProp" class="btn btn-gold">Submit for approval</button>
 </div>
 <div id="bankBox" class="card hide">
  <h2>🏦 My bank account</h2>
  <p class="muted">Where your payouts land.</p>
  <input id="b_bank" placeholder="Bank name">
  <input id="b_num" placeholder="Account number (10 digits)">
  <input id="b_name" placeholder="Account name">
  <button id="saveBank" class="btn btn-primary">Save bank account</button>
 </div>
 <div id="propsBox" class="card"></div>
 <div id="inspBox" class="card"></div>
 <div id="earnBox" class="card hide"></div>
 <div id="payBox" class="card"></div>
 <button id="out" class="btn btn-gray">Sign out</button>
 <div class="footer">AkureKeys 🔑 — every player, one home.</div>
</div>
</div>
<script>
const sb=supabase.createClient('https://esisngduhutxkmztlodh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaXNuZ2R1aHV0eGttenRsb2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjYxMDQsImV4cCI6MjEwMDYwMjEwNH0.743riPefSqsSSBTcOZVHkoqLc-xmjsOI60XJ5Sp4mK4');
function msg(ok,t){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'err');m.innerText=t;m.classList.remove('hide');}
async function session(){const{data}=await sb.auth.getSession();return data.session;}
function list(el,rows,fmt,empty){el.innerHTML='';if(!rows||!rows.length){el.innerHTML='<div class="muted">'+empty+'</div>';return;}rows.forEach(r=>{const d=document.createElement('div');d.className='rowline';d.innerHTML='<span>'+fmt(r)+'</span>';el.appendChild(d);});}
async function render(){
 const s=await session();
 const{data:prof}=await sb.from('profiles').select('role,full_name').eq('id',s.user.id).maybeSingle();
 const role=prof?prof.role:'tenant';
 document.getElementById('roleLine').innerText=(prof?prof.full_name:s.user.email)+' — '+role;
 if(role==='landlord'||role==='admin'){document.getElementById('addBox').classList.remove('hide');document.getElementById('bankBox').classList.remove('hide');}
 if(role==='agent'){document.getElementById('bankBox').classList.remove('hide');}
 if(role!=='tenant'){
  const{data:bank}=await sb.from('payout_accounts').select('*').eq('user_id',s.user.id).maybeSingle();
  if(bank){document.getElementById('b_bank').value=bank.bank_name||'';document.getElementById('b_num').value=bank.account_number||'';document.getElementById('b_name').value=bank.account_name||'';}
 }
 const pb=document.getElementById('propsBox');
 pb.innerHTML='<h2>🏠 '+(role==='agent'?'Listings I manage':'My properties')+'</h2>';
 const{data:props}=await sb.rpc('dashboard_properties');
 list(pb,props,p=>'<b>'+p.title+'</b> • ₦'+Number(p.annual_rent_naira).toLocaleString()+'/yr • <span class="pill '+(p.status==='approved'?'':(p.status==='pending'?'gold':'red'))+'">'+p.status+'</span>','No properties yet.');
 const ib=document.getElementById('inspBox');
 ib.innerHTML='<h2>📅 Inspections</h2>';
 const{data:insp}=await sb.rpc('dashboard_inspections');
 list(ib,insp,i=>'<b>'+i.property_title+'</b><br><span class="muted">'+new Date(i.preferred_date).toLocaleString()+'</span> • <span class="pill '+(i.status==='confirmed'?'':(i.status==='cancelled'?'red':'gold'))+'">'+i.status+'</span>','No inspections yet.');
 if(role==='agent'){
  const eb=document.getElementById('earnBox');eb.classList.remove('hide');
  eb.innerHTML='<h2>🤝 My forever-2.5% ledger</h2>';
  const{data}=await sb.rpc('dashboard_agent_earnings');
  list(eb,data,e=>'<b class="price">₦'+Number(e.amount_naira).toLocaleString()+'</b> <span class="muted">earned '+new Date(e.created_at).toLocaleDateString()+'</span>','No earnings yet.');
 }
 const yb=document.getElementById('payBox');
 yb.innerHTML='<h2>💰 My payouts</h2>';
 const{data:pays}=await sb.rpc('dashboard_payouts');
 list(yb,pays,p=>'<b>'+p.recipient_type+'</b> • ₦'+Number(p.amount_naira).toLocaleString()+' • <span class="pill '+(p.status==='paid'?'':'gold')+'">'+p.status+'</span>','No payouts yet.');
 document.getElementById('dash').classList.remove('hide');
}
document.getElementById('submitProp').onclick=async()=>{try{
 const s=await session();
 const body={title:document.getElementById('p_title').value,property_type:document.getElementById('p_type').value,annual_rent_naira:document.getElementById('p_rent').value,street_address:document.getElementById('p_addr').value,area_landmark:document.getElementById('p_land').value,description:document.getElementById('p_desc').value,bedrooms:document.getElementById('p_bed').value,bathrooms:document.getElementById('p_bath').value};
 msg(true,'Submitting...');
 const r=await fetch('/api/property/submit',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();
 if(!r.ok)return msg(false,d.error||'Failed');
 msg(true,'✅ Submitted! Waiting for admin approval.');render();
}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('saveBank').onclick=async()=>{try{
 const s=await session();
 const{error}=await sb.from('payout_accounts').upsert({user_id:s.user.id,bank_name:document.getElementById('b_bank').value,account_number:document.getElementById('b_num').value,account_name:document.getElementById('b_name').value,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error)return msg(false,error.message);
 msg(true,'✅ Bank account saved. Payouts will land here.');
}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('signin').onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});if(error)return msg(false,error.message);document.getElementById('authBox').classList.add('hide');msg(true,'Welcome!');render();}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('out').onclick=async()=>{await sb.auth.signOut();location.reload();};
(async()=>{const s=await session();if(s){document.getElementById('authBox').classList.add('hide');render();}})();
</script>
</body>
</html>
