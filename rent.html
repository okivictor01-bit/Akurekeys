<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkureKeys — Rent & Escrow</title>
<link rel="stylesheet" href="/akure.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
<div class="topbar">
 <div class="logo">🔒</div>
 <div class="brand">AkureKeys<small>Rent in escrow</small></div>
</div>
<div class="hero">
 <h1>Your rent is safe until you say so 🛡️</h1>
 <p>Pay into escrow, inspect, and release only when satisfied. Landlord, agent and platform are paid automatically.</p>
</div>
<div id="authBox" class="card">
 <h2>Sign in to rent</h2>
 <input id="email" type="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button id="signin" class="btn btn-primary">Sign in / Create account</button>
</div>
<div id="msg" class="msg hide"></div>
<div id="escrowBox" class="card hide">
 <div class="rowline"><span><b>Your escrow</b></span><span id="escStatus" class="pill gold"></span></div>
 <button id="release" class="btn btn-primary">😌 I'm satisfied — RELEASE & pay everyone</button>
 <button id="summary" class="btn btn-ghost">Show 94 / 3.5 / 2.5 split</button>
</div>
<div id="list"></div>
<div class="footer">Escrow = trust. Trust = AkureKeys.</div>
</div>
<script>
const sb=supabase.createClient('https://esisngduhutxkmztlodh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaXNuZ2R1aHV0eGttenRsb2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjYxMDQsImV4cCI6MjEwMDYwMjEwNH0.743riPefSqsSSBTcOZVHkoqLc-xmjsOI60XJ5Sp4mK4');
let myEscrow=null;
let CARDS={};
function msg(ok,t){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'err');m.innerText=t;m.classList.remove('hide');m.scrollIntoView({behavior:'smooth',block:'center'});}
async function session(){const{data}=await sb.auth.getSession();return data.session;}
async function loadEscrow(uid){
 const{data}=await sb.from('escrow_transactions').select('*').eq('tenant_id',uid).order('created_at',{ascending:false}).limit(1);
 if(data&&data.length){myEscrow=data[0];const el=document.getElementById('escStatus');el.innerText=myEscrow.status+' • ₦'+Number(myEscrow.amount_naira).toLocaleString();el.className='pill '+(myEscrow.status==='initiated'?'gold':'');document.getElementById('escrowBox').classList.remove('hide');}
}
async function load(){
 CARDS={};
 const{data,error}=await sb.from('property_listings').select('*');
 if(error)return msg(false,'Listings error: '+error.message);
 const list=document.getElementById('list');list.innerHTML='';
 (data||[]).forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<h2>'+p.title+'</h2><div class="muted">'+p.property_type+' • 📍 '+(p.area_landmark||'Akure')+'</div><div class="rowline" style="margin-top:6px"><span>Annual rent</span><b class="price">₦'+Number(p.annual_rent_naira).toLocaleString()+'/yr</b></div>';
  const b=document.createElement('button');b.className='btn btn-gold';b.innerText='🔒 Rent — pay ₦'+Number(p.annual_rent_naira).toLocaleString()+' into escrow';
  b.onclick=async()=>{try{const s=await session();if(!s)return msg(false,'Sign in first.');msg(true,'Creating rental + escrow...');const r=await fetch('/api/rent/initialize',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({property_id:p.id})});const t=await r.text();let d;try{d=JSON.parse(t);}catch(e){return msg(false,'Non-JSON: '+t.slice(0,150));}if(!r.ok)return msg(false,d.error||t.slice(0,150));if(d.already_paid){return msg(true,'Rent already paid/released for this property.');}window.location.href=d.authorization_url;}catch(e){msg(false,'Error: '+e.message);}};
  c.appendChild(b);list.appendChild(c);
  CARDS[p.id]=c;
 });
 const want=new URLSearchParams(location.search).get('property');
 if(want&&CARDS[want]){CARDS[want].scrollIntoView({behavior:'smooth',block:'center'});CARDS[want].style.outline='3px solid #f2b70a';}
}
document.getElementById('release').onclick=async()=>{try{
 if(!myEscrow)return msg(false,'No escrow yet.');
 const s=await session();
 msg(true,'Releasing + paying landlord, platform & agent...');
 const r=await fetch('/api/rent/release',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({escrow_id:myEscrow.id})});
 const t=await r.text();let d;try{d=JSON.parse(t);}catch(e){return msg(false,'Non-JSON: '+t.slice(0,200));}
 if(!r.ok)return msg(false,d.error||t.slice(0,200));
 const lines=(d.payouts||[]).map(x=>x.ok?'✅ paid '+x.transfer_code:'❌ '+(x.error||'failed')).join('\n');
 msg(true,'✅ RELEASED — automatic payouts:\n'+lines);
 await loadEscrow(s.user.id);
}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('summary').onclick=async()=>{try{if(!myEscrow)return msg(false,'No escrow yet.');const{data,error}=await sb.rpc('get_release_summary',{p_escrow_id:myEscrow.id});if(error)return msg(false,error.message);msg(true,'✅ SPLIT:\n'+JSON.stringify(data,null,1));}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('signin').onclick=async()=>{try{const em=document.getElementById('email').value,pa=document.getElementById('pass').value;let{error}=await sb.auth.signInWithPassword({email:em,password:pa});if(error){({error}=await sb.auth.signUp({email:em,password:pa}));}if(error)return msg(false,error.message);document.getElementById('authBox').classList.add('hide');msg(true,'Signed in!');const s=await session();await loadEscrow(s.user.id);load();}catch(e){msg(false,'Error: '+e.message);}};
(async()=>{try{
 const ref=new URLSearchParams(location.search).get('reference');
 const s=await session();
 if(s){document.getElementById('authBox').classList.add('hide');await loadEscrow(s.user.id);load();}
 if(ref&&s){const r=await fetch('/api/pay/verify',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({reference:ref})});const d=await r.json().catch(()=>({}));msg(!!d.paid,d.paid?'✅ RENT PAID into escrow! Tap RELEASE when satisfied.':'❌ '+JSON.stringify(d));await loadEscrow(s.user.id);}
}catch(e){msg(false,'Load error: '+e.message);}})();
</script>
</body>
</html>
