<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkureKeys — Rent</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;padding:16px}
.card{max-width:460px;margin:0 auto 14px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
h1{font-size:20px}
input{width:100%;padding:10px;margin:4px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:11px;margin:4px 0;border:none;border-radius:8px;background:#0a66ff;color:#fff;font-weight:bold}
button.green{background:#16a34a}button.orange{background:#ea580c}
.msg{margin-top:8px;padding:10px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.hide{display:none}
.row{font-size:14px;margin:2px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
<h1>AkureKeys 🔑 Rent & Escrow</h1>
<div id="authBox">
 <input id="email" type="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button id="signin">Sign in / Create account</button>
</div>
<div id="msg" class="msg hide"></div>
<div id="escrowBox" class="card hide">
 <div class="row"><b>Your escrow:</b> <span id="escStatus"></span></div>
 <button id="release" class="orange">I'm satisfied — RELEASE the money</button>
 <button id="summary" class="green">Show 94/3.5/2.5 split</button>
</div>
<div id="list"></div>
</div>
<script>
const sb=supabase.createClient('https://esisngduhutxkmztlodh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaXNuZ2R1aHV0eGttenRsb2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjYxMDQsImV4cCI6MjEwMDYwMjEwNH0.743riPefSqsSSBTcOZVHkoqLc-xmjsOI60XJ5Sp4mK4');
let myEscrow=null;
function msg(ok,t){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'err');m.innerText=t;}
async function session(){const{data}=await sb.auth.getSession();return data.session;}
async function loadEscrow(uid){
 const{data}=await sb.from('escrow_transactions').select('*').eq('tenant_id',uid).order('created_at',{ascending:false}).limit(1);
 if(data&&data.length){myEscrow=data[0];document.getElementById('escStatus').innerText=myEscrow.status+' • ₦'+myEscrow.amount_naira;document.getElementById('escrowBox').classList.remove('hide');}
}
async function load(){
 const{data,error}=await sb.from('property_listings').select('*');
 if(error)return msg(false,'Listings error: '+error.message);
 const list=document.getElementById('list');list.innerHTML='';
 (data||[]).forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="row"><b>'+p.title+'</b></div><div class="row">'+p.property_type+' • ₦'+p.annual_rent_naira+'/yr</div>';
  const b=document.createElement('button');b.innerText='Rent — pay ₦'+p.annual_rent_naira+' into escrow';
  b.onclick=async()=>{try{const s=await session();if(!s)return msg(false,'Sign in first.');msg(true,'Creating rental + escrow...');const r=await fetch('/api/rent/initialize',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({property_id:p.id})});const t=await r.text();let d;try{d=JSON.parse(t);}catch(e){return msg(false,'Non-JSON: '+t.slice(0,150));}if(!r.ok)return msg(false,d.error||t.slice(0,150));if(d.already_paid){return msg(true,'Rent already paid/released for this property.');}window.location.href=d.authorization_url;}catch(e){msg(false,'Error: '+e.message);}};
  c.appendChild(b);list.appendChild(c);
 });
}
document.getElementById('release').onclick=async()=>{try{if(!myEscrow)return msg(false,'No escrow yet.');const s=await session();const{error}=await sb.from('escrow_transactions').update({status:'released',released_by:s.user.id,released_at:new Date().toISOString()}).eq('id',myEscrow.id);if(error)return msg(false,'Release failed: '+error.message);msg(true,'✅ RELEASED! The 94/3.5/2.5 split just fired. Tap "Show split".');await loadEscrow(s.user.id);}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('summary').onclick=async()=>{try{if(!myEscrow)return msg(false,'No escrow yet.');const{data,error}=await sb.rpc('get_release_summary',{p_escrow_id:myEscrow.id});if(error)return msg(false,error.message);msg(true,'✅ SPLIT:\n'+JSON.stringify(data,null,1));}catch(e){msg(false,'Error: '+e.message);}};
document.getElementById('signin').onclick=async()=>{try{const em=document.getElementById('email').value,pa=document.getElementById('pass').value;let{error}=await sb.auth.signInWithPassword({email:em,password:pa});if(error){({error}=await sb.auth.signUp({email:em,password:pa}));}if(error)return msg(false,error.message);document.getElementById('authBox').classList.add('hide');msg(true,'Signed in!');const s=await session();await loadEscrow(s.user.id);load();}catch(e){msg(false,'Error: '+e.message);}};
(async()=>{try{
 const ref=new URLSearchParams(location.search).get('reference');
 const s=await session();
 if(s){document.getElementById('authBox').classList.add('hide');await loadEscrow(s.user.id);load();}
 if(ref&&s){const r=await fetch('/api/pay/verify',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({reference:ref})});const d=await r.json().catch(()=>({}));msg(!!d.paid,d.paid?'✅ RENT PAID into escrow! Tap the orange RELEASE button when satisfied.':'❌ '+JSON.stringify(d));await loadEscrow(s.user.id);}
}catch(e){msg(false,'Load error: '+e.message);}})();
</script>
</body>
</html>
