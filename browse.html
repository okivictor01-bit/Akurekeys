<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkureKeys — Browse Akure</title>
<link rel="stylesheet" href="/akure.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
<div class="topbar">
 <div class="logo">🔑</div>
 <div class="brand">AkureKeys<small>Verified rentals • Akure</small></div>
</div>
<div class="hero">
 <h1>Find your next home in Akure 🏡</h1>
 <p>Inspect before you pay. Rent protected in escrow. Landlord contact hidden until you unlock.</p>
 <div class="chips"><span class="chip">🔒 Escrow protected</span><span class="chip">✅ Admin verified</span><span class="chip">📅 Inspect first</span></div>
</div>
<div id="authBox" class="card">
 <h2>Sign in to start</h2>
 <input id="email" type="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">
 <button id="signin" class="btn btn-primary">Sign in / Create account</button>
</div>
<div id="msg" class="msg hide"></div>
<div id="detailCard" class="card hide"></div>
<div id="list"></div>
<div class="footer">AkureKeys 🔑 — rent with confidence • Akure, Nigeria</div>
</div>
<script>
const sb=supabase.createClient('https://esisngduhutxkmztlodh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaXNuZ2R1aHV0eGttenRsb2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjYxMDQsImV4cCI6MjEwMDYwMjEwNH0.743riPefSqsSSBTcOZVHkoqLc-xmjsOI60XJ5Sp4mK4');
const EMO={room:'🛏️',self_contain_room:'🏠',room_and_parlour:'🛋️',self_contain_room_and_parlour:'🏠',two_bedroom_flat:'🏢',three_bedroom_flat:'🏬',duplex:'🏡',shop:'🏪',office:'💼',container:'📦'};
function msg(ok,t){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'err');m.innerText=t;m.classList.remove('hide');}
async function session(){const{data}=await sb.auth.getSession();return data.session;}
function showDetails(d){
 const c=document.getElementById('detailCard');
 c.classList.remove('hide');
 c.innerHTML='<span class="pill gold">✅ UNLOCKED</span><h2 style="margin-top:8px">'+d.title+'</h2>'+
 '<div class="rowline"><span>📍 Address</span><b>'+d.street_address+(d.area_landmark?' • '+d.area_landmark:'')+'</b></div>'+
 '<div class="rowline"><span>🏷️ Type</span><b>'+d.property_type+'</b></div>'+
 '<div class="rowline"><span>💰 Rent</span><b class="price">₦'+Number(d.annual_rent_naira).toLocaleString()+'/yr</b></div>'+
 '<div class="rowline"><span>🛏️ Beds / 🛁 Baths</span><b>'+(d.bedrooms==null?'–':d.bedrooms)+' / '+(d.bathrooms==null?'–':d.bathrooms)+'</b></div>'+
 '<div class="rowline"><span>📞 Contact</span><b>'+d.admin_contact+'</b></div>';
 c.scrollIntoView({behavior:'smooth'});
}
async function load(){
 const{data,error}=await sb.from('property_listings').select('*');
 if(error)return msg(false,'Listings error: '+error.message);
 const list=document.getElementById('list');list.innerHTML='';
 if(!data||data.length===0)return msg(false,'No approved properties yet.');
 data.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="thumb">'+(EMO[p.property_type]||'🏠')+'</div><h2>'+p.title+'</h2>'+
  '<div class="muted">📍 '+(p.area_landmark||'Akure')+' • '+(p.bedrooms||'–')+' bed • '+(p.bathrooms||'–')+' bath</div>'+
  '<div class="rowline" style="margin-top:6px"><span class="pill">'+p.property_type+'</span><span class="price">₦'+Number(p.annual_rent_naira).toLocaleString()+'/yr</span></div>';
  const b1=document.createElement('button');b1.className='btn btn-gold';b1.innerText='🔓 Unlock • ₦1,000';
  b1.onclick=async()=>{try{const s=await session();if(!s)return msg(false,'Sign in first.');msg(true,'Creating payment...');const r=await fetch('/api/fee/initialize',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({property_id:p.id})});const t=await r.text();let d;try{d=JSON.parse(t);}catch(e){return msg(false,'Non-JSON: '+t.slice(0,150));}if(!r.ok)return msg(false,d.error||t.slice(0,150));if(d.already_paid){return msg(true,'Already unlocked — tap "View details". No new charge.');}window.location.href=d.authorization_url;}catch(e){msg(false,'Error: '+e.message);}};
  const b2=document.createElement('button');b2.className='btn btn-ghost';b2.innerText='View details (if unlocked)';
  b2.onclick=async()=>{try{const{data:det,error:e2}=await sb.rpc('get_property_details',{p_id:p.id});if(e2)return msg(false,'🔒 '+e2.message);showDetails(det[0]);}catch(e){msg(false,'Error: '+e.message);}};
  c.appendChild(b1);c.appendChild(b2);list.appendChild(c);
 });
}
document.getElementById('signin').onclick=async()=>{try{const em=document.getElementById('email').value,pa=document.getElementById('pass').value;let{error}=await sb.auth.signInWithPassword({email:em,password:pa});if(error){({error}=await sb.auth.signUp({email:em,password:pa}));}if(error)return msg(false,error.message);document.getElementById('authBox').classList.add('hide');msg(true,'Signed in!');load();}catch(e){msg(false,'Error: '+e.message);}};
(async()=>{try{
 const ref=new URLSearchParams(location.search).get('reference');
 const s=await session();
 if(s){document.getElementById('authBox').classList.add('hide');}
 if(ref&&s){const r=await fetch('/api/pay/verify',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({reference:ref})});const d=await r.json().catch(()=>({}));msg(!!d.paid,d.paid?'✅ Access fee PAID! Tap "View details".':'❌ '+JSON.stringify(d));}
 if(s)load();
}catch(e){msg(false,'Load error: '+e.message);}})();
</script>
</body>
</html>
